name: E2E Testing
on: push

jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          build: npm run --max_old_space_size=12288 build
          start: npm run start:dev
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 300
          browser: chrome