name: E2E Testing
on: push

jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          build: yarn build
          start: yarn start
          browser: chrome
